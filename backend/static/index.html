<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web HMI | Live Stream</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: rgba(30, 41, 59, 0.7);
            --surface-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #60a5fa;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--surface-border);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            z-index: 10;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            color: var(--accent-color);
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            transition: all 0.3s ease;
        }

        .status-badge.connected {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
            box-shadow: 0 0 8px currentColor;
        }
        
        .status-badge.connected .status-dot {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        main {
            flex: 1;
            padding: 2rem;
            display: flex;
            gap: 2rem;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .video-container {
            flex: 2;
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(16px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .video-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--surface-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .video-title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .video-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            min-height: 400px;
        }

        #video-stream {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: opacity 0.3s ease;
        }

        .no-signal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-secondary);
            font-size: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .no-signal svg {
            width: 48px;
            height: 48px;
            opacity: 0.5;
        }

        .side-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin: 0 0 1.2rem 0;
            font-size: 1.1rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .telemetry-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .telemetry-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .telemetry-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .telemetry-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0.875rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .btn.secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Loading Spinner */
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 3px solid var(--accent-color);
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 900px) {
            main {
                flex-direction: column;
                padding: 1rem;
                gap: 1rem;
            }
            
            .video-container, .side-panel {
                flex: none;
                width: 100%;
            }
            
            .video-wrapper {
                min-height: 250px;
            }
            
            header {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-color);">
                <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14v-4z"></path>
                <rect x="3" y="6" width="12" height="12" rx="2" ry="2"></rect>
            </svg>
            Web<span>HMI</span>
        </div>
        <div class="status-badge" id="connection-status">
            <div class="status-dot"></div>
            <span id="status-text">Disconnected</span>
        </div>
    </header>

    <main>
        <div class="video-container">
            <div class="video-header">
                <div class="video-title">Live Camera Stream</div>
                <div id="fps-counter" style="color: var(--text-secondary); font-size: 0.9rem;">0 FPS</div>
            </div>
            <div class="video-wrapper">
                <div class="no-signal" id="no-signal">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path>
                    </svg>
                    <span>Waiting for video stream...</span>
                </div>
                <img id="video-stream" src="" alt="Live Stream" style="display: none;">
            </div>
        </div>

        <div class="side-panel">
            <div class="card controls">
                <h3>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
                    </svg>
                    Controls
                </h3>
                <button class="btn" id="btn-connect">Connect Camera</button>
                <button class="btn secondary" id="btn-disconnect">Disconnect</button>
            </div>

            <div class="card">
                <h3>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                    </svg>
                    Telemetry
                </h3>
                <div class="telemetry-grid">
                    <div class="telemetry-item">
                        <div class="telemetry-label">Status</div>
                        <div class="telemetry-value" id="t-status" style="color: var(--text-primary); font-size: 1.2rem;">Offline</div>
                    </div>
                    <div class="telemetry-item">
                        <div class="telemetry-label">IP Address</div>
                        <div class="telemetry-value" id="t-ip" style="font-size: 1.1rem;">-</div>
                    </div>
                    <div class="telemetry-item">
                        <div class="telemetry-label">Temperature</div>
                        <div class="telemetry-value" id="t-temp">0°C</div>
                    </div>
                    <div class="telemetry-item">
                        <div class="telemetry-label">Exposure</div>
                        <div class="telemetry-value" id="t-exp">0</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let ws = null;
        const videoStream = document.getElementById('video-stream');
        const noSignal = document.getElementById('no-signal');
        const statusBadge = document.getElementById('connection-status');
        const statusText = document.getElementById('status-text');
        
        let framesReceived = 0;
        let lastFpsTime = Date.now();

        function connectWebSocket() {
            // Determine WS URL based on current host
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/camera/ws`;
            
            console.log(`Connecting to ${wsUrl}...`);
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('WebSocket Connected');
                statusBadge.classList.add('connected');
                statusText.textContent = 'Connected';
                
                // Subscribe to streams
                ws.send(JSON.stringify({
                    action: "subscribe",
                    types: ["video", "telemetry"]
                }));
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.action === "video" && data.frame) {
                        videoStream.src = `data:image/jpeg;base64,${data.frame}`;
                        if (videoStream.style.display === 'none') {
                            videoStream.style.display = 'block';
                            noSignal.style.display = 'none';
                        }
                        
                        framesReceived++;
                        const now = Date.now();
                        if (now - lastFpsTime >= 1000) {
                            document.getElementById('fps-counter').textContent = `${framesReceived} FPS`;
                            framesReceived = 0;
                            lastFpsTime = now;
                        }
                    } 
                    else if (data.action === "telemetry" && data.status) {
                        const s = data.status;
                        document.getElementById('t-status').textContent = s.connected ? 'Active' : 'Offline';
                        document.getElementById('t-status').style.color = s.connected ? 'var(--success)' : 'var(--text-secondary)';
                        document.getElementById('t-ip').textContent = s.ip || '-';
                        document.getElementById('t-temp').textContent = s.temperature ? `${s.temperature.toFixed(1)}°C` : '-';
                        document.getElementById('t-exp').textContent = s.exposure || '0';
                    }
                } catch (e) {
                    console.error("Error parsing message", e);
                }
            };

            ws.onclose = () => {
                console.log('WebSocket Disconnected');
                statusBadge.classList.remove('connected');
                statusText.textContent = 'Disconnected';
                videoStream.style.display = 'none';
                noSignal.style.display = 'flex';
                document.getElementById('fps-counter').textContent = '0 FPS';
                
                // Try to reconnect in 3 seconds
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = (err) => {
                console.error('WebSocket Error:', err);
                ws.close();
            };
        }

        // Action Buttons
        document.getElementById('btn-connect').addEventListener('click', async () => {
            try {
                const res = await fetch('/camera/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip: "192.168.1.100" }) // Example IP
                });
                console.log("Connect command sent:", await res.json());
            } catch (e) {
                console.error("Error connecting camera", e);
            }
        });

        document.getElementById('btn-disconnect').addEventListener('click', async () => {
            try {
                const res = await fetch('/camera/disconnect', { method: 'POST' });
                console.log("Disconnect command sent:", await res.json());
            } catch (e) {
                console.error("Error disconnecting camera", e);
            }
        });

        // Initialize connection
        connectWebSocket();
    </script>
</body>
</html>
