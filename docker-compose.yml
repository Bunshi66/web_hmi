services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    network_mode: "host"
    volumes:
      - ./backend:/app
      - /opt/MVS:/opt/MVS:ro
    environment:
      - LD_LIBRARY_PATH=/opt/MVS/lib/64
      - MVCAM_COMMON_RUNENV=/opt/MVS/lib
      - GENICAM_GENTL64_PATH=/opt/MVS/lib/64
      - MVCAM_SDK_PATH=/opt/MVS
      - MVCAM_SOFTWARE_LIBENV=/opt/MVS/lib
      - MVCAM_GENICAM_CLPROTOCOL=/opt/MVS/lib/CLProtocol
      - ALLUSERSPROFILE=/opt/MVS/MVFG
      - DATABASE_URL=postgresql+asyncpg://admin:admin@127.0.0.1:5432/webhmi
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 3

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=webhmi
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
    network_mode: "host"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  db_data:
